<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060e1d">
  <meta name="description" content="A new adventure is coming. Coding Castle launches on 1 March 2027.">
  <title>Coding Castle — A new adventure awaits</title>
  <link rel="canonical" href="https://codingcastle.org/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/press-start-2p.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script src="countdown.js" defer></script>
</head>
<body>
  <main>
    <header class="intro">
      <p class="eyebrow"><span aria-hidden="true">✦</span> A NEW ADVENTURE AWAITS <span aria-hidden="true">✦</span></p>
      <h1><img class="logo" src="banner.png" width="2172" height="724" alt="Coding Castle"></h1>
      <p class="subtitle">Something legendary is under construction.</p>
    </header>
    <section class="launch" aria-labelledby="launch-heading">
      <h2 id="launch-heading">THE GATES OPEN IN</h2>
      <div class="countdown" role="timer" aria-label="Time until Coding Castle launches" aria-live="off">
        <div class="unit"><span class="number" id="days">---</span><span class="label">DAYS</span></div>
        <span class="separator" aria-hidden="true">:</span>
        <div class="unit"><span class="number" id="hours">--</span><span class="label">HOURS</span></div>
        <span class="separator" aria-hidden="true">:</span>
        <div class="unit"><span class="number" id="minutes">--</span><span class="label">MINUTES</span></div>
        <span class="separator" aria-hidden="true">:</span>
        <div class="unit"><span class="number" id="seconds">--</span><span class="label">SECONDS</span></div>
      </div>
      <p class="launch-date"><span aria-hidden="true">◆</span> <time datetime="2027-03-01T00:00:00Z">1 MARCH 2027 · MIDNIGHT GMT</time> <span aria-hidden="true">◆</span></p>
      <noscript><p>The adventure begins on 1 March 2027. Enable JavaScript for the live countdown.</p></noscript>
    </section>
    <div class="landscape" aria-hidden="true"><img src="bg.png" width="2172" height="724" alt=""></div>
    <footer><span>CODINGCASTLE.ORG</span><span>BUILDING THE NEXT ADVENTURE</span></footer>
  </main>
</body>
</html>
